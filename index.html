async function openBackupDB(){
  return await new Promise((resolve,reject)=>{
    const req=indexedDB.open(BACKUP_DB,1);
    req.onupgradeneeded=()=>req.result.createObjectStore('handles');
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function getBackupHandle(){
  if(backupHandle) return backupHandle;
  try{
    const idb=await openBackupDB();
    backupHandle=await new Promise((resolve,reject)=>{
      const tx=idb.transaction('handles','readonly');
      const req=tx.objectStore('handles').get('backup');
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>reject(req.error);
    });
    return backupHandle;
  }catch(e){return null}
}
async function storeBackupHandle(handle){
  backupHandle=handle;
  try{
    const idb=await openBackupDB();
    const tx=idb.transaction('handles','readwrite');
    tx.objectStore('handles').put(handle,'backup');
  }catch(e){}
}
function supportsFileSystemBackup(){ return !!window.showSaveFilePicker; }
async function writeBackupFile(){
  if(!supportsFileSystemBackup()) return false;
  const handle=await getBackupHandle();
  if(!handle) return false;
  try{
    const perm=await handle.queryPermission({mode:'readwrite'});
    if(perm!=='granted'){
      const req=await handle.requestPermission({mode:'readwrite'});
      if(req!=='granted') return false;
    }
    const writable=await handle.createWritable();
    await writable.write(JSON.stringify(db,null,2));
    await writable.close();
    return true;
  }catch(e){ return false; }
}
let backupTimer=null;
function autoBackup(){
  if(!supportsFileSystemBackup()) return;
  clearTimeout(backupTimer);
  backupTimer=setTimeout(writeBackupFile,150);
}

function fmt(d){if(!d)return'';let [y,m,day]=d.split('-');return `${day}.${m}.${y}`}

function localISODate(d=new Date()){
 let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
 return `${y}-${m}-${day}`;
}
function reportRange(){
 const preset=document.getElementById('reportPreset')?.value||'month';
 const now=new Date();
 let start='',end=localISODate(now);
 if(preset==='day'){ start=end; }
 else if(preset==='week'){
   const d=new Date(now); const day=d.getDay(); const diff=day===0?-6:1-day;
   d.setDate(d.getDate()+diff); start=localISODate(d);
 } else if(preset==='lastmonth'){
   const first=new Date(now.getFullYear(),now.getMonth()-1,1);
   const last=new Date(now.getFullYear(),now.getMonth(),0);
   start=localISODate(first); end=localISODate(last);
 } else if(preset==='custom'){
   start=document.getElementById('reportStart')?.value||end;
   end=document.getElementById('reportEnd')?.value||end;
 } else {
   start=localISODate(new Date(now.getFullYear(),now.getMonth(),1));
 }
 return {preset,start,end};
}
function inReportRange(date,start,end){ return !!date && date>=start && date<=end; }

<div class="field"><label>Status</label><select name="status">${['Gözləyir','Davam edir','Tamamlandı','Ləğv edildi'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Kateqoriya</label><input name="category" value="${esc(x.category)}" placeholder="Məs: Kamera quraşdırılması"></div>
<div class="field full"><label>Qeyd</label><textarea name="note">${esc(x.note)}</textarea></div></div><br><button class="primary">Yadda saxla</button></form>`)}
function saveJob(e,id){e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f);o.id=id||Date.now().toString();o.amount=+o.amount;o.cost=+o.cost||0;o.paid=+o.paid||0;o.created=o.created||new Date().toISOString();let i=db.jobs.findIndex(x=>x.id===o.id);if(i>=0)db.jobs[i]=o;else db.jobs.push(o);save();closeModal();render()}
const cats=['Yanacaq','Yemək','Yol','Material','Avadanlıq','Mağaza','Telefon/İnternet','Kommunal','Şəxsi','Digər'];
function openExpense(id){let x=db.expenses.find(a=>a.id===id)||{};modal(id?'Xərci redaktə et':'Yeni xərc',`<form onsubmit="saveExpense(event,'${id||''}')"><div class="formgrid"><div class="field"><label>Tarix</label><input type="date" name="date" value="${x.date||today()}"></div><div class="field"><label>Kateqoriya</label><select name="category">${cats.map(s=>`<option ${x.category===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Məbləğ (₼)</label><input type="number" step="0.01" name="amount" required value="${x.amount??''}"></div><div class="field"><label>Qeyd</label><input name="note" value="${esc(x.note)}"></div></div><br><button class="primary">Yadda saxla</button></form>`)}
function saveExpense(e,id){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=id||Date.now().toString();o.amount=+o.amount;let i=db.expenses.findIndex(x=>x.id===o.id);if(i>=0)db.expenses[i]=o;else db.expenses.push(o);save();closeModal();render()}
function openIncome(id){let x=db.incomes.find(a=>a.id===id)||{};modal(id?'Gəliri redaktə et':'Yeni gəlir',`<form onsubmit="saveIncome(event,'${id||''}')"><div class="formgrid"><div class="field"><label>Tarix</label><input type="date" name="date" value="${x.date||today()}"></div><div class="field"><label>Gəlir mənbəyi</label><input name="source" required value="${esc(x.source)}"></div><div class="field"><label>Məbləğ (₼)</label><input type="number" step="0.01" name="amount" required value="${x.amount??''}"></div><div class="field"><label>Qeyd</label><input name="note" value="${esc(x.note)}"></div></div><br><button class="primary">Yadda saxla</button></form>`)}
function saveIncome(e,id){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=id||Date.now().toString();o.amount=+o.amount;let i=db.incomes.findIndex(x=>x.id===o.id);if(i>=0)db.incomes[i]=o;else db.incomes.push(o);save();closeModal();render()}
function openDebt(id){let x=db.debts.find(a=>a.id===id)||{};modal(id?'Borcu redaktə et':'Yeni borc',`<form onsubmit="saveDebt(event,'${id||''}')"><div class="formgrid"><div class="field"><label>Tip</label><select name="type"><option value="receive" ${x.type==='receive'?'selected':''}>Alınacaq</option><option value="pay" ${x.type==='pay'?'selected':''}>Veriləcək</option></select></div><div class="field"><label>Şəxs/Firma</label><input name="person" required value="${esc(x.person)}"></div><div class="field"><label>Ümumi məbləğ (₼)</label><input type="number" step="0.01" name="amount" required value="${x.amount??''}"></div><div class="field"><label>Ödənilən (₼)</label><input type="number" step="0.01" name="paid" value="${x.paid??0}"></div><div class="field full"><label>Qeyd</label><textarea name="note">${esc(x.note)}</textarea></div></div><br><button class="primary">Yadda saxla</button></form>`)}
function saveDebt(e,id){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=id||Date.now().toString();o.amount=+o.amount;o.paid=+o.paid;let i=db.debts.findIndex(x=>x.id===o.id);if(i>=0)db.debts[i]=o;else db.debts.push(o);save();closeModal();render()}
function openNote(){modal('Yeni qeyd',`<form onsubmit="saveNote(event)"><div class="field"><label>Qeyd / görüləcək iş</label><textarea name="text" required autofocus></textarea></div><br><button class="primary">Yadda saxla</button></form>`)}
function saveNote(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));db.notes.push({id:Date.now().toString(),text:o.text,date:today(),done:false});save();closeModal();render()}
function toggleNote(id){let x=db.notes.find(a=>a.id===id);if(x)x.done=!x.done;save();render()}
function del(type,id){if(!confirm('Bu məlumatı silmək istəyirsiniz?'))return;db[type]=db[type].filter(x=>x.id!==id);save();render()}
async function chooseBackupFile(){
  if(!supportsFileSystemBackup()){
    exportData();
    alert('iPhone üçün backup hazırlandı. Faylı Files tətbiqində saxlaya bilərsiniz.');
    return;
  }
  try{
    const handle=await window.showSaveFilePicker({
      suggestedName:'islerim-xerclerim-backup.json',
      types:[{description:'JSON backup',accept:{'application/json':['.json']}}]
    });
    await storeBackupHandle(handle);
    await writeBackupFile();
    updateBackupStatus();
    alert('Backup faylı seçildi. Bundan sonra hər əməliyyatdan sonra eyni fayl yenilənəcək.');
  }catch(e){}
}
function exportData(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));
  a.download='islerim-xerclerim-backup.json';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function importData(){document.getElementById('file').click()}
async function updateBackupStatus(){
  const el=document.getElementById('backupStatus');
  if(!el)return;
  const h=await getBackupHandle();
  if(!supportsFileSystemBackup()){ el.textContent='📱 iPhone rejimi: məlumatlar telefonda saxlanılır. Backup üçün “Backup çıxar” düyməsindən istifadə edin.'; return; }
  el.textContent=h?'🟢 Avtomatik backup aktivdir — seçilmiş fayl hər əməliyyatdan sonra yenilənir.':'🔴 Avtomatik backup faylı seçilməyib.';
}
function readBackup(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render();alert('Backup bərpa edildi.')}catch{alert('Backup faylı düzgün deyil.')}};r.readAsText(file)}
function clearAll(){if(confirm('Bütün məlumatlar silinəcək. Əminsiniz?')){db={jobs:[],expenses:[],incomes:[],debts:[],notes:[],customers:[]};save();render()}}
nav();render();setTimeout(updateBackupStatus,100);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
